<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de especialidades · Aula TP Chile</title>
<meta name="description" content="Catálogo público de especialidades TP. Simulador activo, misión 3D y rutas en preparación, sin mezclar el ingreso al campus.">
<link rel="stylesheet" href="/landing/portal-reference.css?v=20260925.9">
<style>
  body{margin:0;background:#f4f7fb;color:#0f2744;font-family:"Nunito Sans",system-ui,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
  header.bar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 20px;background:#082b67;color:#fff}
  header.bar a{color:#fff;text-decoration:none;font-weight:700}
  h1{font-size:clamp(1.6rem,3vw,2.4rem);margin:0 0 8px}
  .lead{max-width:68ch;color:#334155}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
  .filters button{border:1px solid #d7e3f4;background:#fff;border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer}
  .filters button[aria-pressed="true"]{background:#082b67;color:#fff;border-color:#082b67}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  article{background:#fff;border:1px solid #d7e3f4;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  article img{width:100%;height:120px;object-fit:cover;display:block}
  article div{padding:14px 14px 16px;display:grid;gap:6px}
  .tag{font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .tag.live{color:#0f766e}.tag.soon{color:#9a3412}.tag.mission{color:#1d4ed8}
  h2{font-size:1.05rem;margin:0}
  p{margin:0;color:#475569;font-size:.92rem}
  .go{margin-top:8px;font-weight:800;color:#082b67}
</style>
</head>
<body>
<header class="bar">
  <a href="/#inicio">Aula TP Chile</a>
  <nav aria-label="Catálogo">
    <a href="/#especialidades">Especialidades</a>
    · <a href="/portal/cursos/">Campus</a>
    · <a href="/#preguntas">Demo</a>
  </nav>
</header>
<main class="wrap">
  <p class="tag live">Catálogo público · sin login</p>
  <h1>Especialidades TP</h1>
  <p class="lead">Primero las rutas con simulador o misión. Después el catálogo por sector. Una especialidad en preparación no hereda el video ni la foto de otra. El campus queda aparte: ahí se entra con cuenta.</p>
  <div class="filters" role="toolbar" aria-label="Filtrar por estado">
    <button type="button" data-filter="all" aria-pressed="true">Todas</button>
    <button type="button" data-filter="live" aria-pressed="false">Simulador</button>
    <button type="button" data-filter="mission" aria-pressed="false">Misión 3D</button>
    <button type="button" data-filter="soon" aria-pressed="false">En preparación</button>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
(function () {
  var items = [
    ['live','Electricidad','Electricidad','Circuitos, mediciones y decisiones de la especialidad. Simulador activo.','/portal/cursos/','Entrar al simulador','#ca8a04','ELE'],
    ['live','Salud','Atención de Enfermería','Cuidados básicos, signos vitales y registro. Simulador activo.','/portal/cursos/','Entrar al simulador','#be123c','ENF'],
    ['live','Construcción','Refrigeración y Climatización','Montaje, puesta en marcha y diagnóstico. Simulador activo.','/portal/cursos/','Entrar al simulador','#0e7490','CLI'],
    ['mission','Metalmecánica','Mecánica Automotriz','Misión Laboral 3D: Compresión perdida. No reutiliza el video de clima.','/mision_laboral/','Entrar a la misión','#b91c1c','AUT'],
    ['soon','Administración','Administración de Empresas','Gestión de personas, logística y atención. Video en preparación.','/#preguntas','Solicitar ruta','#1d4e89','ADM'],
    ['soon','Administración','Contabilidad','Registro, documentos tributarios e información económica.','/#preguntas','Solicitar ruta','#0f6e6e','CON'],
    ['soon','Alimentación','Elaboración Industrial de Alimentos','Procesos, inocuidad y control. Sin foto de gastronomía ajena.','/#preguntas','Solicitar ruta','#b45309','ALI'],
    ['soon','Agropecuario','Agropecuaria','Producción vegetal y animal.','/#preguntas','Solicitar ruta','#3f6b2a','AGR'],
    ['soon','Confección','Vestuario y Confección Textil','Patronaje, corte y costura.','/#preguntas','Solicitar ruta','#9d174d','VES'],
    ['soon','Construcción','Instalaciones Sanitarias','Agua potable y evacuación.','/#preguntas','Solicitar ruta','#0369a1','SAN'],
    ['soon','Construcción','Montaje Industrial','Estructuras y equipos.','/#preguntas','Solicitar ruta','#44403c','MON'],
    ['soon','Gráfico','Dibujo Técnico','Representación, acotado y lectura de planos.','/#preguntas','Solicitar ruta','#1e3a8a','DIB'],
    ['soon','Gráfico','Gráfica','Preprensa y control de producción.','/#preguntas','Solicitar ruta','#7c3aed','GRA'],
    ['soon','Hotelería y Turismo','Servicios de Hotelería','Recepción y habitaciones. Póster propio, no el del hero.','/#preguntas','Solicitar ruta','#9a3412','HOT'],
    ['soon','Hotelería y Turismo','Servicios de Turismo','Atención al visitante.','/#preguntas','Solicitar ruta','#b45309','TUR'],
    ['soon','Maderero','Forestal','Silvicultura y seguridad.','/#preguntas','Solicitar ruta','#166534','FOR'],
    ['soon','Maderero','Muebles y Terminaciones en Madera','Trazado, maquinado y ensamble.','/#preguntas','Solicitar ruta','#92400e','MUE'],
    ['soon','Metalmecánica','Construcciones Metálicas','Trazado, corte y soldadura.','/#preguntas','Solicitar ruta','#334155','MET'],
    ['soon','Metalmecánica','Mecánica Industrial','Diagnóstico y mantenimiento.','/#preguntas','Solicitar ruta','#1e293b','MEC'],
    ['soon','Metalmecánica','Mecánica de Mantenimiento de Aeronaves','Inspección y documentación.','/#preguntas','Solicitar ruta','#1d4ed8','AER'],
    ['soon','Minero','Asistencia en Geología','Muestreo y registro de terreno.','/#preguntas','Solicitar ruta','#854d0e','GEO'],
    ['soon','Minero','Explotación Minera','Ciclo productivo y seguridad.','/#preguntas','Solicitar ruta','#713f12','MIN'],
    ['soon','Minero','Metalurgia Extractiva','Chancado, molienda y control.','/#preguntas','Solicitar ruta','#7f1d1d','MTG'],
    ['soon','Marítimo','Acuicultura','Cultivo y bioseguridad.','/#preguntas','Solicitar ruta','#0f766e','ACU'],
    ['soon','Marítimo','Operaciones Portuarias','Transferencia de carga.','/#preguntas','Solicitar ruta','#155e75','PUE'],
    ['soon','Marítimo','Pesquería','Faena y conservación.','/#preguntas','Solicitar ruta','#1e40af','PES'],
    ['soon','Marítimo','Tripulación de Naves Mercantes y Especiales','Guardias y faena.','/#preguntas','Solicitar ruta','#1e3a8a','NAV'],
    ['soon','Química e Industria','Química Industrial','Muestreo y control de procesos.','/#preguntas','Solicitar ruta','#6d28d9','QUI'],
    ['soon','Salud y Educación','Atención de Párvulos','Bienestar, juego y cuidado.','/#preguntas','Solicitar ruta','#db2777','PAR'],
    ['soon','Tecnología','Conectividad y Redes','Cableado y verificación.','/#preguntas','Solicitar ruta','#0f172a','RED'],
    ['soon','Tecnología','Programación','Lógica y desarrollo.','/#preguntas','Solicitar ruta','#312e81','PRG'],
    ['soon','Tecnología','Telecomunicaciones','Instalación y medición.','/#preguntas','Solicitar ruta','#4338ca','TEL']
  ];
  var grid = document.getElementById('grid');
  function poster(color, code) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="' + color + '"/><text x="32" y="210" fill="#fff" font-family="Nunito Sans,sans-serif" font-size="88" font-weight="800">' + code + '</text></svg>';
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }
  function paint(filter) {
    grid.innerHTML = items.filter(function (it) { return filter === 'all' || it[0] === filter; }).map(function (it) {
      var state = it[0] === 'live' ? 'Simulador' : it[0] === 'mission' ? 'Misión 3D' : 'En preparación';
      return '<article data-state="' + it[0] + '"><img src="' + poster(it[6], it[7]) + '" alt="Oficio de ' + it[2] + '"><div><span class="tag ' + it[0] + '">' + it[1] + ' · ' + state + '</span><h2>' + it[2] + '</h2><p>' + it[3] + '</p><a class="go" href="' + it[4] + '">' + it[5] + '</a></div></article>';
    }).join('');
  }
  paint('all');
  document.querySelectorAll('.filters button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filters button').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
      btn.setAttribute('aria-pressed', 'true');
      paint(btn.dataset.filter);
    });
  });
})();
</script>
</body>
</html>
